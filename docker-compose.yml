services:
  web:
    build: .
    env_file: .env.example
    depends_on: [db, redis, postfix, dovecot]
    volumes: ["maildata:/var/mail"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: industrial_hell_mail
      POSTGRES_USER: ihm
      POSTGRES_PASSWORD: ihm
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  celery:
    build: .
    command: celery -A config worker -l info
    env_file: .env.example
    depends_on: [redis, db]
  postfix:
    image: boky/postfix
    environment:
      ALLOWED_SENDER_DOMAINS: example.com
    volumes:
      - ./infra/postfix/main.cf:/etc/postfix/main.cf:ro
      - maildata:/var/mail
  dovecot:
    image: dovecot/dovecot
    volumes:
      - ./infra/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - maildata:/var/mail
volumes:
  pgdata:
  maildata:
