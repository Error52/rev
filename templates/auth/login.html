<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Industrial-Hell Mail :: Login</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="scanlines login-body">
  <div class="noise"></div>
  <div class="vignette"></div>

  <main class="login-wrap">
    <div class="status-line">[ SECURE NODE ONLINE ] :: [ SMTP/IMAP LINKED ]</div>
    <h1 class="glitch" data-text="INDUSTRIAL-HELL MAIL">INDUSTRIAL-HELL MAIL</h1>
    <p class="subtitle">underground encrypted relay terminal</p>

    <form method="post" class="panel login-panel">
      {% csrf_token %}
      <label>USERNAME</label>
      <input name="username" type="text" required placeholder="root.operator">

      <label>PASSWORD</label>
      <input name="password" type="password" required placeholder="••••••••••••">

      <button type="submit">LOGIN</button>
      <a class="ghost-link" href="#">FORGOT PASSWORD</a>
    </form>

    <div class="terminal-note">
      <span>$ access policy:</span> no public registration / admin-created identities only.
    </div>
  </main>
</body>
</html>
